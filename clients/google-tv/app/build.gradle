plugins { id 'com.android.application' }
android {
 namespace 'com.mythicreverie.tv'
 compileSdkVersion 'android-36.1'
 defaultConfig { applicationId 'com.mythicreverie.tv'; minSdk 23; targetSdk 35; versionCode 4; versionName '0.4.0-preview' }
 signingConfigs { debug { storeFile file(System.getenv('IO_ANDROID_DEBUG_KEYSTORE') ?: System.getProperty('user.home')+'/.android/debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 applicationVariants.all { variant -> variant.outputs.all { outputFileName = 'Mythic-Reverie-Google-TV-0.4.0-preview.apk' } }
}
dependencies {
 implementation 'com.google.zxing:core:3.5.4'
 implementation 'androidx.media3:media3-exoplayer:1.11.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
 implementation 'androidx.media3:media3-ui:1.11.1'
}
